</style></head><body><main id="app" class="preview"></main><div id="toast" class="hidden" role="status"></div><dialog id="prototype-info"><button class="close smallbutton" onclick="this.closest('dialog').close()">关闭 ×</button><h2>Across · 跨时区会议协作</h2><p>这是一份用于作品展示的高保真交互原型。保留墨刀 V2 的排期、会中协作、待办确认、任务接力四步，统一为同一套工作台界面。</p><p>会议人物、时间、字幕与纪要均为样例。表达草稿可在本次浏览器会话保存；真实音视频、AI 生成、通知和任务分发服务尚未接入。</p></dialog><dialog id="decision"><button class="close smallbutton" onclick="this.closest('dialog').close()">关闭 ×</button><h2>你来决定下一步。</h2><p>支付页对接已阻塞 2 天。下面两种方案都需要人确认。</p><div style="display:flex;gap:15px;flex-wrap:wrap"><button class="cta" onclick="this.closest('dialog').close();toast('已选择催办张交付。仅记录预览选择，未发送消息。')">催张交付</button><button class="cta outline" onclick="this.closest('dialog').close();toast('已选择先用模拟数据推进。仅记录预览选择。')">先用模拟数据推进</button></div></dialog><script>

function meeting(){return `<section class="meeting"><div class="workspace"><aside class="sidebar"><div class="brand">Across.</div><p class="workspace-name">跨时区 · 更平等的协作</p><button class="sideitem current" onclick="meetingStep=0;render()">◷ &nbsp; 三方周会</button><button class="sideitem" onclick="meetingStep=3;render()">▤ &nbsp; 接力任务</button><button class="sideitem" onclick="meetingStep=2;render()">≡ &nbsp; 会议记录</button><div class="sidefoot"><div class="avatarline"><span class="initial">张</span><span>北京工作空间<br>UTC +8</span></div></div></aside><div class="meetingmain">${meetingNav()}<div class="bodymain">${[scheduleScreen,focusScreen,summaryScreen,relayScreen][meetingStep]()}</div></div></div></section>`}
const times=[[21,15,9],[23,17,11],[8,2,20]],names=['张 · 北京','Anna · 柏林','Mike · 纽约'],costs=['张在晚间；Anna 与 Mike 在工作时段。无人需要凌晨参会。','张需要工作到 23 点；Anna 接近工作时段结束。','Anna 在凌晨 02:00；Mike 是前一天晚间。两人不适。'];
function scheduleScreen(){return `<div class="eyebrow"><span>○ 已读取三人时区与空闲信息</span></div><h1>选择三方周会时间</h1><p class="description">对照三地当地时间，查看每个方案的时间成本。</p><div class="schedulegrid"><div class="timechart"><div class="charttitle"><span>三地当地时间</span><small class="muted">时区样例 · 北京 / 柏林 / 纽约</small></div><div class="timegrid"><span></span><div class="axis"><span>00</span><span>06</span><span>12</span><span>18</span><span>24</span></div><span></span></div>${names.map((n,i)=>`<div class="timegrid zone-row"><div class="person">${n}<small>${['UTC +8','UTC +2','UTC −4'][i]}</small></div><div class="bar"><div class="workhours"></div><div class="marker" style="left:${times[candidate][i]/24*100}%"></div></div><div class="localtime">${String(times[candidate][i]).padStart(2,'0')}:00<small>${times[candidate][i]>=8&&times[candidate][i]<=17?'工作时段':times[candidate][i]<6?'凌晨睡眠':candidate===2&&i===2?'前一天晚间':'晚间'}</small></div></div>`).join('')}<div class="legend"><i></i>工作时段示意<b></b>所选时间</div><div class="explainline"><b>当前方案的代价</b><span>${costs[candidate]}</span></div></div><aside class="scheduleaside"><div>${['21:00 / 推荐','23:00 / 次选','08:00 / 不推荐'].map((t,i)=>`<button class="candidate ${candidate===i?'selected':''}" onclick="candidate=${i};render()"><span class="radio"></span><span><h3>北京 ${t}</h3><p>${['仅你一人在晚间','你要忙到 23 点','Anna 凌晨两点参会'][i]}</p></span></button>`).join('')}</div><div class="decisionbox"><small class="micro">需要你决定 / 01</small><p>${candidate===2?'此方案占用凌晨睡眠时段。请考虑其他时间，或改为异步。':'接受上述时间成本，再确认排期。'}</p><button class="cta" onclick="confirmTime()">确认这个时间 <span>→</span></button><button class="alternative" onclick="asyncChoice()">没有合适窗口？改成异步</button></div></aside></div><div class="layout-note" style="padding:30px 0 0">谁在工作，谁在休息，都应当看得见。</div>`}
function confirmTime(){if(candidate===2){toast('该方案含凌晨参会。本预览保留风险提示，建议先选其他方案。');return}meetingStep=1;render();toast('已在预览中确认时间，进入会中协作。')}
function asyncChoice(){toast('异步备选：共享议题 → 各自在工作时段回复 → 主持人确认结论。')}
function focusScreen(){return `<div class="eyebrow">○ 会中场景示例 · 主讲语言：德语</div><h1>会中协作</h1><p class="description">原声与中文并行。表达辅助仅自己可见。</p><div class="focuscanvas"><div><div class="speaker"><div class="micro">主讲画面</div><div class="rings"><i></i><i></i><i></i></div><div class="avatar">A</div><div class="speakername"><span>Anna / 柏林</span><div class="waves">${'<i></i>'.repeat(12)}</div><span>Deutsch</span></div></div><div class="captions"><div class="captionhead"><span>并行字幕</span><button onclick="toast('原始转写：Ich denke, wir sollten…（来自 V2 字幕示例）')">查看原始转写 ↗</button></div><p class="german">Ich denke, wir sollten…</p><p class="chinese">我认为应优先推进登录模块……</p></div></div><aside class="privatepane"><h3>先把想法写下来</h3><p>表达辅助 · 仅自己可见</p><textarea class="textinput" id="idea" placeholder="比如：登录问题影响用户进入，应先修复……" aria-label="零散想法">${escapeHtml(sessionStorage.getItem('idea')||'')}</textarea><button class="smallbutton" onclick="polish()">整理成得体表达 ↗</button><div class="hostnote"><small class="micro muted">主持人提示 · 仅主持人可见</small><p style="color:#5e778a;margin-top:12px">${hostChoice||'Mike 暂未发言。是否给他一个表达机会？'}</p><div class="buttons"><button onclick="hostChoice='你已选择邀请 Mike。';render();toast('邀请由主持人决定，AI 不自动点名。')">邀请发言</button><button onclick="hostChoice='本次提示已忽略。';render()">暂时忽略</button></div></div><p style="margin-top:18px">未轮到你？<button style="color:#54748c;text-decoration:underline" onclick="toast('异步补言入口：文字意见经本人确认后再并入记录。')">写下补充意见</button></p></aside></div><div class="callfooter"><div class="people"><span class="initial">张</span><span class="initial">A</span><span class="initial">M</span><span style="font-size:11px;color:#85949f;margin:auto 8px">3 人参与</span></div><button class="cta" onclick="meetingStep=2;render()">结束会议，生成待办 <span>→</span></button></div>`}
function polish(){const t=$('#idea').value.trim();if(!t)return toast('先写下你的想法。');sessionStorage.setItem('idea',t);toast('已保存草稿。此按钮演示表达辅助入口，未调用语言模型。')}
function summaryScreen(){return `<div class="eyebrow">○ AI 整理后的纪要示例</div><h1>确认会议待办</h1><p class="description">摘要可切换语言，待办仍由参会者确认。</p><div class="summarysheet"><div><div class="language">${['中文','Deutsch','English'].map((s,i)=>`<button class="${language===i?'current':''}" onclick="language=${i};render()">${s}</button>`).join('')}</div><div class="minute">${['会议决议：优先推进登录模块；下周三前输出方案。','Beschluss: Das Login-Modul hat Priorität. Der Vorschlag soll bis nächsten Mittwoch vorliegen.','Decision: Prioritize the login module. Prepare the proposal by next Wednesday.'][language]}</div><table class="tasktable"><thead><tr><th>待办事项</th><th>负责人</th><th>截止日期</th></tr></thead><tbody><tr><td>官网登录页问题修复</td><td>Mike</td><td>9 / 12</td></tr><tr><td>德语区首页文案本地化</td><td>Anna</td><td>9 / 10</td></tr><tr><td>支付页与登录页对接</td><td><select aria-label="第三项负责人" onchange="owner=this.value;render()"><option value="">待选择</option>${['张','Anna','Mike'].map(s=>`<option ${owner===s?'selected':''}>${s}</option>`).join('')}</select></td><td><input type="date" aria-label="第三项截止日期" style="font-size:11px;width:116px;padding:6px;border:1px solid #ccd7de" value="${escapeHtml(sessionStorage.getItem('due')||'')}" onchange="sessionStorage.setItem('due',this.value)"></td></tr></tbody></table></div><aside class="decisionbox" style="margin-top:0"><small class="micro">需要你决定 / 02</small><p>${owner?'第三项已指定负责人：'+owner+'。请检查截止日期，然后确认分发。':'第三项尚未明确负责人和截止日期，需要你补充。'}</p><button class="cta" onclick="confirmTasks()">确认待办并分发 <span>→</span></button><p style="font-size:11px;color:#99a5ad;margin-top:18px">确认后，才分发并录入多维表格。</p></aside></div>`}
function confirmTasks(){if(!owner||!sessionStorage.getItem('due'))return toast('请先为第三项指定负责人和截止日期。');meetingStep=3;render();toast('预览流程已进入任务接力；未向真实成员发送消息。')}
function relayScreen(){return `<div class="eyebrow">○ 离线进展示例</div><h1>轮到你接力了。</h1><p class="description">先看变化，再处理真正需要你介入的卡点。</p><div class="roundsummary" style="margin-top:28px">离线期间新增 2 条决议，@你 1 项待办，另有 1 项等你回应。</div><div class="tasks"><div class="taskrow"><span class="state">进行中</span><span>登录模块</span><span>Mike</span><span class="muted">9 / 12</span></div><div class="taskrow"><span class="state">临期</span><span>德语区首页文案本地化</span><span>Anna</span><span class="muted">9 / 10</span></div><div class="taskrow"><span class="state">已完成</span><span>会议纪要已归档</span><span>—</span><span class="muted">已同步</span></div></div><div class="blocked"><div style="flex:1"><small class="micro" style="color:#92805b">需要你决定 / 03</small><h3 style="margin-top:12px">支付页对接已阻塞 2 天</h3><p>AI 建议：催张交付，或先用模拟数据推进，接口就绪后再替换。</p></div><button class="cta" onclick="$('#decision').showModal()">选择方案 / 手动介入 ↗</button></div><div class="footeraction"><span class="muted" style="font-size:12px">归档会保留这一轮的决议与进展。</span><button class="smallbutton" onclick="toast('本轮进展已在预览中标记为待归档；实际归档服务未连接。')">归档本轮进展 →</button></div></div>`}

function render(){document.querySelector('#app').innerHTML=meeting();history.replaceState(null,'','?step='+meetingStep);}
render();
</script></body></html>
